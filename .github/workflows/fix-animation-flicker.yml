name: Fix animation flicker

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: stop bounds from observing animated assets'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stop Bounds observe on animated assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          old = '<Bounds fit clip observe margin={1.2}>'
          new = '<Bounds fit clip margin={1.2}>'
          if old not in s:
              raise SystemExit('Bounds observe pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.tsx
          git commit -m "fix: stop bounds from observing animated assets"
          git push
