name: Fix canvas DOM crash

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move DOM timeline outside Canvas
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          old = '<KeyframeTimeline selected={selected} />'
          target = '            <KeyframeTimeline selected={selected} />'
          if s.count(old) != 1:
              raise SystemExit(f'expected one timeline occurrence, found {s.count(old)}')
          s = s.replace(target, '', 1)
          marker = '</section><small className="help">W/E/R: transform'
          if marker not in s:
              raise SystemExit('sidebar insertion point not found')
          s = s.replace(marker, '</section><KeyframeTimeline selected={selected} /><small className="help">W/E/R: transform', 1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git commit -m 'fix: render timeline outside R3F Canvas'
          git push
