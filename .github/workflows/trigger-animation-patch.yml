name: Trigger animation patch

on:
  push:
    branches: [main]

permissions:
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch patch workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run patch-animation.yml --ref main
