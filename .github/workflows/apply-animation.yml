name: Apply animation controls

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'feat: add animation timeline and speed controls') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/App.tsx'); s=p.read_text()
          if 'animationSpeed' in s:
              raise SystemExit('already patched')
          s=re.sub(r'function AnimationController\(\{scene,clips,index,playing\}:\{scene:THREE\.Object3D\|null;clips:THREE\.AnimationClip\[\];index:number;playing:boolean\}\)\{.*?\n\}', '''function AnimationController({scene,clips,index,playing,speed,seekTime,onTime}:{scene:THREE.Object3D|null;clips:THREE.AnimationClip[];index:number;playing:boolean;speed:number;seekTime:number|null;onTime:(time:number)=>void}){
 const mixer=useRef<THREE.AnimationMixer|null>(null),action=useRef<THREE.AnimationAction|null>(null),lastReported=useRef(-1)
 useEffect(()=>{if(!scene||!clips.length){mixer.current=null;action.current=null;return};const m=new THREE.AnimationMixer(scene);mixer.current=m;const clip=clips[index]??clips[0];const a=m.clipAction(clip);a.reset().setLoop(THREE.LoopRepeat,Infinity);a.timeScale=speed;if(playing)a.play();action.current=a;lastReported.current=-1;return()=>{m.stopAllAction();m.uncacheRoot(scene);mixer.current=null;action.current=null}},[scene,clips,index])
 useEffect(()=>{if(action.current)action.current.timeScale=speed},[speed])
 useEffect(()=>{if(!action.current||seekTime===null)return;const duration=clips[index]?.duration??0;const time=THREE.MathUtils.clamp(seekTime,0,duration);action.current.time=time;action.current.paused=!playing;onTime(time)},[seekTime,clips,index,playing,onTime])
 useEffect(()=>{if(!action.current)return;playing?action.current.play():action.current.paused=true},[playing])
 useFrame((_,delta)=>{if(!mixer.current||!action.current)return;mixer.current.update(delta);const duration=clips[index]?.duration??0;const time=duration>0?((action.current.time%duration)+duration)%duration:0;if(Math.abs(time-lastReported.current)>.1){lastReported.current=time;onTime(time)}})
 return null
}''',s,count=1,flags=re.S)
          s=s.replace("[animationClips,setAnimationClips]=useState<THREE.AnimationClip[]>([]),[animationIndex,setAnimationIndex]=useState(0),[animationPlaying,setAnimationPlaying]=useState(true)","[animationClips,setAnimationClips]=useState<THREE.AnimationClip[]>([]),[animationIndex,setAnimationIndex]=useState(0),[animationPlaying,setAnimationPlaying]=useState(true),[animationSpeed,setAnimationSpeed]=useState(1),[animationTime,setAnimationTime]=useState(0),[animationSeekTime,setAnimationSeekTime]=useState<number|null>(null)")
          s=s.replace("setAnimationClips([]);setAnimationIndex(0);setAnimationPlaying(true);","setAnimationClips([]);setAnimationIndex(0);setAnimationPlaying(true);setAnimationSpeed(1);setAnimationTime(0);setAnimationSeekTime(null);")
          s=s.replace("const tree=modelScene?getHierarchy(modelScene):[]","const tree=modelScene?getHierarchy(modelScene):[]\n const activeAnimation=animationClips[animationIndex]??animationClips[0]??null\n const handleAnimationSeek=(value:number)=>{setAnimationPlaying(false);setAnimationSeekTime(value);setAnimationTime(value)}\n const reportAnimationTime=useCallback((time:number)=>setAnimationTime(time),[])")
          s=s.replace("const normalizedQuery=libraryQuery.trim().toLowerCase();const filteredModels=publicModels.filter(model=>","const normalizedQuery=libraryQuery.trim().toLowerCase();const filteredModels=publicModels.filter(model=>model.name!=='Animated Triangle'&&model.name!=='Cameras'&&")
          old="<section className=\"panel\"><span className=\"section-label\">Animation</span>{animationClips.length?<><div className=\"animation-controls\"><button onClick={()=>setAnimationPlaying(v=>!v)}>{animationPlaying?'Pause':'Play'}</button><select value={animationIndex} onChange={e=>{setAnimationIndex(+e.target.value);setAnimationPlaying(true)}}>{animationClips.map((clip,i)=><option key={clip.name+'-'+i} value={i}>{clip.name||'Animation '+(i+1)}</option>)}</select></div><small>{animationClips.length} clip{animationClips.length===1?'':'s'} · realtime playback</small></>:<small>이 모델에는 Animation Clip이 없습니다.</small>}</section>"
          new="<section className=\"panel\"><span className=\"section-label\">Animation</span>{animationClips.length&&activeAnimation?<><div className=\"animation-controls\"><button onClick={()=>setAnimationPlaying(v=>!v)}>{animationPlaying?'Pause':'Play'}</button><button onClick={()=>{setAnimationPlaying(false);setAnimationSeekTime(0);setAnimationTime(0)}} title=\"Restart animation\">↺</button><select value={animationIndex} onChange={e=>{setAnimationIndex(+e.target.value);setAnimationTime(0);setAnimationSeekTime(0);setAnimationPlaying(true)}}>{animationClips.map((clip,i)=><option key={clip.name+'-'+i} value={i}>{clip.name||'Animation '+(i+1)}</option>)}</select></div><label>Speed <input type=\"range\" min=\"0.1\" max=\"2\" step=\"0.1\" value={animationSpeed} onChange={e=>setAnimationSpeed(+e.target.value)}/><output>{animationSpeed.toFixed(1)}×</output></label><label>Timeline <input type=\"range\" min=\"0\" max={activeAnimation.duration} step=\"0.01\" value={Math.min(animationTime,activeAnimation.duration)} onChange={e=>handleAnimationSeek(+e.target.value)} onPointerUp={()=>setAnimationPlaying(true)}/><output>{animationTime.toFixed(2)} / {activeAnimation.duration.toFixed(2)}s</output></label><small>{animationClips.length} clip{animationClips.length===1?'':'s'} · {activeAnimation.name||'Animation '+(animationIndex+1)}</small></>:<small>이 모델에는 Animation Clip이 없습니다.</small>}</section>"
          if s.count(old)!=1: raise SystemExit('animation UI not found')
          s=s.replace(old,new)
          s=s.replace("<AnimationController scene={modelScene} clips={animationClips} index={animationIndex} playing={animationPlaying}/>","<AnimationController scene={modelScene} clips={animationClips} index={animationIndex} playing={animationPlaying} speed={animationSpeed} seekTime={animationSeekTime} onTime={reportAnimationTime}/>")
          p.write_text(s)
          PY
          npm install --legacy-peer-deps
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "feat: add animation timeline and speed controls"
          git push
