name: Do animation patch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/App.tsx'); s=p.read_text()
          if 'animationSpeed' in s: print('already patched'); raise SystemExit(0)
          s=re.sub(r'function AnimationController\(\{scene,clips,index,playing\}:.*?\n\}', '''function AnimationController({scene,clips,index,playing,speed,seekTime,onTime}:{scene:THREE.Object3D|null;clips:THREE.AnimationClip[];index:number;playing:boolean;speed:number;seekTime:number|null;onTime:(time:number)=>void}){\n const mixer=useRef<THREE.AnimationMixer|null>(null),action=useRef<THREE.AnimationAction|null>(null),lastReported=useRef(-1)\n useEffect(()=>{if(!scene||!clips.length){mixer.current=null;action.current=null;return};const m=new THREE.AnimationMixer(scene);mixer.current=m;const a=m.clipAction(clips[index]??clips[0]);a.reset().setLoop(THREE.LoopRepeat,Infinity);a.timeScale=speed;if(playing)a.play();action.current=a;lastReported.current=-1;return()=>{m.stopAllAction();m.uncacheRoot(scene);mixer.current=null;action.current=null}},[scene,clips,index])\n useEffect(()=>{if(action.current)action.current.timeScale=speed},[speed])\n useEffect(()=>{if(!action.current||seekTime===null)return;action.current.time=THREE.MathUtils.clamp(seekTime,0,clips[index]?.duration??0);action.current.paused=!playing;onTime(action.current.time)},[seekTime,clips,index,playing,onTime])\n useEffect(()=>{if(!action.current)return;playing?action.current.play():action.current.paused=true},[playing])\n useFrame((_,delta)=>{if(!mixer.current||!action.current)return;mixer.current.update(delta);const d=clips[index]?.duration??0;const t=d?((action.current.time%d)+d)%d:0;if(Math.abs(t-lastReported.current)>.1){lastReported.current=t;onTime(t)}})\n return null\n}''',s,count=1,flags=re.S)
          s=s.replace('[animationClips,setAnimationClips]=useState<THREE.AnimationClip[]>([]),[animationIndex,setAnimationIndex]=useState(0),[animationPlaying,setAnimationPlaying]=useState(true)','[animationClips,setAnimationClips]=useState<THREE.AnimationClip[]>([]),[animationIndex,setAnimationIndex]=useState(0),[animationPlaying,setAnimationPlaying]=useState(true),[animationSpeed,setAnimationSpeed]=useState(1),[animationTime,setAnimationTime]=useState(0),[animationSeekTime,setAnimationSeekTime]=useState<number|null>(null)')
          s=s.replace('setAnimationClips([]);setAnimationIndex(0);setAnimationPlaying(true);','setAnimationClips([]);setAnimationIndex(0);setAnimationPlaying(true);setAnimationSpeed(1);setAnimationTime(0);setAnimationSeekTime(null);')
          s=s.replace('const tree=modelScene?getHierarchy(modelScene):[]','const tree=modelScene?getHierarchy(modelScene):[]\n const activeAnimation=animationClips[animationIndex]??animationClips[0]??null\n const handleAnimationSeek=(value:number)=>{setAnimationPlaying(false);setAnimationSeekTime(value);setAnimationTime(value)}\n const reportAnimationTime=useCallback((time:number)=>setAnimationTime(time),[])')
          s=s.replace("const normalizedQuery=libraryQuery.trim().toLowerCase();const filteredModels=publicModels.filter(model=>","const normalizedQuery=libraryQuery.trim().toLowerCase();const filteredModels=publicModels.filter(model=>model.name!=='Animated Triangle'&&model.name!=='Cameras'&&")
          old="<section className=\"panel\"><span className=\"section-label\">Animation</span>{animationClips.length?<><div className=\"animation-controls\"><button onClick={()=>setAnimationPlaying(v=>!v)}>{animationPlaying?'Pause':'Play'}</button><select value={animationIndex} onChange={e=>{setAnimationIndex(+e.target.value);setAnimationPlaying(true)}}>{animationClips.map((clip,i)=><option key={clip.name+'-'+i} value={i}>{clip.name||'Animation '+(i+1)}</option>)}</select></div><small>{animationClips.length} clip{animationClips.length===1?'':'s'} · realtime playback</small></>:<small>이 모델에는 Animation Clip이 없습니다.</small>}</section>"
          new="<section className=\"panel\"><span className=\"section-label\">Animation</span>{animationClips.length&&activeAnimation?<><div className=\"animation-controls\"><button onClick={()=>setAnimationPlaying(v=>!v)}>{animationPlaying?'Pause':'Play'}</button><button onClick={()=>{setAnimationPlaying(false);setAnimationSeekTime(0);setAnimationTime(0)}}>↺</button><select value={animationIndex} onChange={e=>{setAnimationIndex(+e.target.value);setAnimationTime(0);setAnimationSeekTime(0);setAnimationPlaying(true)}}>{animationClips.map((clip,i)=><option key={clip.name+'-'+i} value={i}>{clip.name||'Animation '+(i+1)}</option>)}</select></div><label>Speed <input type=\"range\" min=\"0.1\" max=\"2\" step=\"0.1\" value={animationSpeed} onChange={e=>setAnimationSpeed(+e.target.value)}/><output>{animationSpeed.toFixed(1)}×</output></label><label>Timeline <input type=\"range\" min=\"0\" max={activeAnimation.duration} step=\"0.01\" value={Math.min(animationTime,activeAnimation.duration)} onChange={e=>handleAnimationSeek(+e.target.value)} onPointerUp={()=>setAnimationPlaying(true)}/><output>{animationTime.toFixed(2)} / {activeAnimation.duration.toFixed(2)}s</output></label><small>{animationClips.length} clip{animationClips.length===1?'':'s'} · {activeAnimation.name||'Animation '+(animationIndex+1)}</small></>:<small>이 모델에는 Animation Clip이 없습니다.</small>}</section>"
          if s.count(old)!=1: raise SystemExit('animation UI not found')
          s=s.replace(old,new)
          s=s.replace('<AnimationController scene={modelScene} clips={animationClips} index={animationIndex} playing={animationPlaying}/>','<AnimationController scene={modelScene} clips={animationClips} index={animationIndex} playing={animationPlaying} speed={animationSpeed} seekTime={animationSeekTime} onTime={reportAnimationTime}/>')
          p.write_text(s)
          PY
          npm install --legacy-peer-deps
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: add animation timeline and speed controls"
          git push
