name: Fix initial bounds

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch initial bounds fitting
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()

          old_import = "import { Bounds, Environment, Grid, OrbitControls, TransformControls, useGLTF } from '@react-three/drei'"
          new_import = "import { Bounds, Environment, Grid, OrbitControls, TransformControls, useBounds, useGLTF } from '@react-three/drei'"
          if old_import not in s:
              raise SystemExit('drei import pattern not found')
          s = s.replace(old_import, new_import, 1)

          marker = "function SceneSettings(p:SceneSettingsProps)"
          component = "function InitialBounds({model}:{model:THREE.Object3D|null}){const bounds=useBounds();useEffect(()=>{if(!model)return;const raf=requestAnimationFrame(()=>{bounds.refresh(model).clip().fit()});return()=>cancelAnimationFrame(raf)},[bounds,model]);return null}\n"
          if marker not in s:
              raise SystemExit('SceneSettings marker not found')
          s = s.replace(marker, component + marker, 1)

          old_bounds = "<Bounds fit clip margin={1.2}>"
          new_bounds = "<Bounds margin={1.2}>"
          if old_bounds not in s:
              raise SystemExit('Bounds JSX pattern not found')
          s = s.replace(old_bounds, new_bounds, 1)

          old_model = "<Bounds margin={1.2}><GLTFModel"
          new_model = "<Bounds margin={1.2}><InitialBounds model={modelScene}/><GLTFModel"
          if old_model not in s:
              raise SystemExit('GLTFModel bounds pattern not found')
          s = s.replace(old_model, new_model, 1)

          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: fit bounds once after asset load"
          git push
